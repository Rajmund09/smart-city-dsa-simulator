version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smart_city_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: smart_city
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart_city_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_city"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_city_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=smart_city
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smart_city_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_city_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smart_city_net

volumes:
  postgres_data:

networks:
  smart_city_net:
    driver: bridge
